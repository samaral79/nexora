#!/usr/sbin/nft -f
# Firewall da Nexora: ninguém de fora abre ligações para este PC, a não ser o que está aqui.
# Tudo o que sai é permitido. Para abrir uma porta, junta uma linha à cadeia "input".
flush ruleset

table inet nexora {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        meta l4proto { icmp, ipv6-icmp } accept     # ping e o IPv6 a funcionar
        tcp dport 22 accept                          # SSH (só responde se ligares o sshd)
        udp dport 68 accept                          # DHCP (IPv4)
        udp dport 546 accept                         # DHCPv6
        udp dport 5353 accept                        # mDNS: impressoras e partilhas na rede (Avahi)
        udp dport 27031-27036 accept                 # Steam: Remote Play e jogos na rede local
        tcp dport 27036-27037 accept                 # Steam: transferências entre PCs da casa
    }
    chain forward {
        type filter hook forward priority filter; policy accept;
    }
}
