# pacman.conf do build da ISO (no contentor CachyOS). O sistema instalado usa o do pacote pacman
# do CachyOS (/etc/pacman.conf), com os repositórios do CachyOS e do Arch.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# pacotes da Nexora, compilados agora pelo container-build.sh
[nexora]
SigLevel = Optional TrustAll
Server = file:///work/repo

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
