# Nexora: o driver NVIDIA só entra quando o nexora-gpu-select.service o escolhe
# (placas suportadas); nas outras fica o nouveau. Ver /usr/libexec/nexora-gpu-select.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
# Wayland (niri) precisa de KMS; fbdev dá consola em alta resolução
options nvidia_drm modeset=1 fbdev=1
# guardar a VRAM ao suspender (os serviços nvidia-suspend/resume tratam do resto)
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_UsePageAttributeTable=1
