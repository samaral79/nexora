[package]
name = "nexora-monitor"
version = "0.2.0"
edition = "2021"
description = "Nexora Build — monitor do build da Nexora Linux (Slint, render por software)"

[dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
regex = "1"
resvg = { version = "0.50", default-features = false }
serde_json = "1"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
